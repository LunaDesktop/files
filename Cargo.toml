[package]
name = "luna-files"
version = "0.0.9"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.80"
authors = ["Patryk Szkudlarek / libLuna contributors"]
description = "Luna Files — menedżer plików środowiska Luna (libLuna, bez GTK): nawigacja, kosz XDG, urządzenia, operacje w tle."
# Po utworzeniu osobnego repozytorium ustaw np.:
# repository = "https://github.com/mijsys/luna-files"

[workspace]
resolver = "2"

[dependencies]
libluna-core = { git = "https://github.com/LunaDesktop/libLuna.git", version = "0.0.9" }
libluna-i18n = { git = "https://github.com/LunaDesktop/libLuna.git", version = "0.0.9" }
libluna-render = { git = "https://github.com/LunaDesktop/libLuna.git", version = "0.0.9" }
libluna-platform = { git = "https://github.com/LunaDesktop/libLuna.git", version = "0.0.9" }
libluna-widgets = { git = "https://github.com/LunaDesktop/libLuna.git", version = "0.0.9" }
rustix = { version = "0.38", features = ["fs"] }
libc = "0.2"
jpeg-decoder = { version = "0.3", default-features = false }

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
